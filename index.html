<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Allston Car Wash – ACW App</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="container">
    <h2>Allston Car Wash</h2>
    <p class="subtitle">Employee Schedule App</p>

    <input type="email" id="email" placeholder="Email" autocomplete="username"/>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password"/>

    <button id="signInBtn" onclick="loginUser()">Sign In</button>
    <p id="diag" class="error"></p>
  </div>

  <!-- WELCOME / DASHBOARD -->
  <div id="welcome" class="container" style="display:none;">
    <div class="header">
      <h2>Welcome</h2>
      <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </div>

    <p id="welcomeName"></p>
    <p id="welcomeRole" class="role"></p>

    <!-- SCHEDULE TABLE -->
    <div id="schedule"></div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="modal">
    <div class="modal-content glass">
      <button class="close" onclick="closeSettings()">×</button>
      <h3>Settings</h3>
      <button id="changePassBtn" onclick="openChangePassword()">Change Password</button>
      <button onclick="refreshApp()">Refresh / Update</button>
      <button onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <!-- CHANGE PASSWORD MODAL (tu JS lo crea si no existe, pero lo dejamos por si acaso) -->
  <div id="changePasswordModal" class="modal">
    <div class="modal-content glass">
      <button class="close" onclick="closeChangePassword()">×</button>
      <h3>Change Password</h3>
      <input id="oldPass" type="password" placeholder="Current password">
      <input id="newPass" type="password" placeholder="New password">
      <input id="confirmPass" type="password" placeholder="Confirm password">
      <p id="passDiag" class="error"></p>
      <button onclick="submitChangePassword()">Save</button>
    </div>
  </div>

  <!-- ================= TEAM EDITOR (Managers) ================= -->
  <!-- OJO: estos IDs son los que tu app.js espera -->
  <section id="teamEditorSection" style="display:none;">
    <div class="team-editor-header">
      <h2>Team Editor</h2>

      <div class="team-editor-actions">
        <!-- app.js inyecta aquí: Save / Close / New Week -->
        <span id="teamSaveStatus" style="font-size:12px;color:#666;"></span>
        <button id="teamReloadBtn" class="btn" style="display:none;">Reload</button>
      </div>
    </div>

    <div id="teamTableWrap"></div>
  </section>
  <!-- ========================================================== -->

  <div class="footer">
    <p>Powered by JAG15 | Allston Car Wash © 2025</p>
    <p id="versionLabel"></p>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
